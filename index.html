<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordenadas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Coordenadas</h2>

    <img src="Cordenadas.png" alt="">

    <label for="x">Digite o valor de X:</label>
    <input type="number" id="x" step="0.1" placeholder="Valor de X">

    <label for="y">Digite o valor de Y:</label>
    <input type="number" id="y" step="0.1" placeholder="Valor de Y">

    <button onclick="verificar()">Verificar</button>

    <div id="resultado" class="resultado"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>
